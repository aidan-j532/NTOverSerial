name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    uses: ./.github/workflows/build-linux.yml

  build-windows:
    uses: ./.github/workflows/build-windows.yml

  release:
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-22.04

    steps:
      - name: Download Linux executable
        uses: actions/download-artifact@v4
        with:
          name: NTOverAOA-linux-x86_64
          path: release-assets/linux

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: NTOverAOA-windows-x86_64
          path: release-assets/windows

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: NTOverAOA ${{ inputs.tag }}
          draft: true
          generate_release_notes: true
          body: |
            ## Included builds

            Download the build for your platform:

            - Linux x86_64: `NTOverAOA`
            - Windows x86_64: `NTOverAOA.exe`

            This draft release was built automatically from the selected commit.
          files: |
            release-assets/linux/NTOverAOA
            release-assets/windows/NTOverAOA.exe