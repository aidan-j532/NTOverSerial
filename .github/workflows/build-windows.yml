name: Build Windows executable

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build libwdi
        run: |
          msbuild third_party/libwdi/libwdi/.msvc/embedder.vcxproj /m /p:Configuration=Release /p:Platform=Win32
          msbuild third_party/libwdi/libwdi/.msvc/libwdi_dll.vcxproj /m /p:Configuration=Release /p:Platform=x64

      - name: Build one-file executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name NTOverAOA
          --collect-all ntcore
          --collect-all native
          --collect-all libusb
          --hidden-import usb.backend.libusb1
          --add-binary "third_party/libwdi/x64/Release/dll/libwdi.dll;libwdi"
          run.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NTOverAOA-windows-x86_64
          path: dist/NTOverAOA.exe
          if-no-files-found: error
