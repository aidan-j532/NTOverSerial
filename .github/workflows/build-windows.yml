name: Build Windows executable

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build libwdi
        shell: pwsh
        run: |
          $wdkInstaller = Join-Path $env:RUNNER_TEMP "wdfcoinstaller.msi"
          $wdkExtract = Join-Path $env:RUNNER_TEMP "wdk"
          $libusb0Zip = Join-Path $env:RUNNER_TEMP "libusb0-redist.zip"
          $libusb0Extract = Join-Path $env:RUNNER_TEMP "libusb0"
          $libusbkArchive = Join-Path $env:RUNNER_TEMP "libusbk-redist.7z"
          $libusbkExtract = Join-Path $env:RUNNER_TEMP "libusbk"
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkID=253170" `
            -OutFile $wdkInstaller
          Invoke-WebRequest `
            -Uri "https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.0/libusb-win32-bin-1.4.0.0.zip" `
            -OutFile $libusb0Zip
          Invoke-WebRequest `
            -Uri "https://github.com/mcuee/libusbk/releases/download/V3.1.0.0/libusbK-3.1.0.0-bin.7z" `
            -OutFile $libusbkArchive

          $extract = Start-Process msiexec.exe `
            -ArgumentList @('/a', $wdkInstaller, '/qn', "TARGETDIR=$wdkExtract") `
            -Wait `
            -PassThru

          if ($extract.ExitCode -ne 0) {
            throw "WDK redistributable extraction failed with exit code $($extract.ExitCode)"
          }

          $wdf = Get-ChildItem `
            -Path $wdkExtract `
            -Filter WdfCoInstaller01011.dll `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $wdf) {
            throw "WdfCoInstaller01011.dll was not found in the installed Windows Kits"
          }

          New-Item -ItemType Directory -Path $libusb0Extract -Force | Out-Null
          Expand-Archive -Path $libusb0Zip -DestinationPath $libusb0Extract -Force
          $libusb0Root = Get-ChildItem `
            -Path $libusb0Extract `
            -Directory `
            -Filter "libusb-win32*" `
            | Select-Object -First 1
          if (-not $libusb0Root) {
            throw "libusb-win32 archive extraction failed"
          }

          New-Item -ItemType Directory -Path $libusbkExtract -Force | Out-Null
          & 7z x $libusbkArchive "-o$libusbkExtract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "libusbK archive extraction failed with exit code $LASTEXITCODE"
          }
          $libusbkRoot = Get-ChildItem `
            -Path $libusbkExtract `
            -Directory `
            -Filter "libusbK*" `
            | Select-Object -First 1
          if (-not $libusbkRoot) {
            throw "libusbK archive extraction failed"
          }

          $wdkRoot = Split-Path (Split-Path (Split-Path (Split-Path $wdf.FullName -Parent) -Parent) -Parent) -Parent
          $buildMacros = 'WDK_DIR="' + $wdkRoot.Replace('\', '/') + '";LIBUSB0_DIR="' + $libusb0Root.FullName.Replace('\', '/') + '";LIBUSBK_DIR="' + (Join-Path $libusbkRoot.FullName "bin").Replace('\', '/') + '"'
          $libwdiRoot = (Resolve-Path "third_party/libwdi").Path
          $solutionDir = "$libwdiRoot\"

          msbuild third_party/libwdi/libwdi/.msvc/embedder.vcxproj /m `
            /p:Configuration=Release /p:Platform=Win32 `
            /p:SolutionDir="$solutionDir" /p:BuildMacros="$buildMacros"
          msbuild third_party/libwdi/libwdi/.msvc/installer_x86.vcxproj /m `
            /p:Configuration=Release /p:Platform=Win32 `
            /p:SolutionDir="$solutionDir" /p:BuildMacros="$buildMacros"
          msbuild third_party/libwdi/libwdi/.msvc/installer_x64.vcxproj /m `
            /p:Configuration=Release /p:Platform=x64 `
            /p:SolutionDir="$solutionDir" /p:BuildMacros="$buildMacros"
          msbuild third_party/libwdi/libwdi/.msvc/installer_arm64.vcxproj /m `
            /p:Configuration=Release /p:Platform=ARM64 `
            /p:SolutionDir="$solutionDir" /p:BuildMacros="$buildMacros"

          Push-Location "$libwdiRoot\libwdi"
          & .\embedder.exe embedded.h
          if ($LASTEXITCODE -ne 0) {
            throw "libwdi embedder failed with exit code $LASTEXITCODE"
          }
          Pop-Location

          msbuild third_party/libwdi/libwdi/.msvc/libwdi_dll.vcxproj /m `
            /p:Configuration=Release /p:Platform=x64 `
            /p:SolutionDir="$solutionDir" /p:BuildMacros="$buildMacros" `
            /p:BuildProjectReferences=false /p:PreBuildEventUseInBuild=false

      - name: Build one-file executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name NTOverAOA
          --collect-all ntcore
          --collect-all native
          --collect-all libusb
          --hidden-import usb.backend.libusb1
          --add-binary "third_party/libwdi/x64/Release/dll/libwdi.dll;libwdi"
          run.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NTOverAOA-windows-x86_64
          path: dist/NTOverAOA.exe
          if-no-files-found: error
