name: Build Windows executable

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build libwdi
        shell: pwsh
        run: |
          $wdkInstaller = Join-Path $env:RUNNER_TEMP "wdfcoinstaller.msi"
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkID=253170" `
            -OutFile $wdkInstaller

          $install = Start-Process msiexec.exe `
            -ArgumentList @('/i', $wdkInstaller, '/qn', '/norestart') `
            -Wait `
            -PassThru

          if ($install.ExitCode -notin @(0, 3010)) {
            throw "WDK redistributable installation failed with exit code $($install.ExitCode)"
          }

          $wdf = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\Windows Kits" `
            -Filter WdfCoInstaller01011.dll `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $wdf) {
            throw "WdfCoInstaller01011.dll was not found in the installed Windows Kits"
          }

          $wdkRoot = Split-Path (Split-Path (Split-Path (Split-Path $wdf.FullName -Parent) -Parent) -Parent) -Parent
          $env:CL = '/DWDK_DIR="' + $wdkRoot.Replace('\', '/') + '"'

          msbuild third_party/libwdi/libwdi.sln `
            /t:"libwdi (dll)" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64

      - name: Build one-file executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name NTOverAOA
          --collect-all ntcore
          --collect-all native
          --collect-all libusb
          --hidden-import usb.backend.libusb1
          --add-binary "third_party/libwdi/x64/Release/dll/libwdi.dll;libwdi"
          run.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NTOverAOA-windows-x86_64
          path: dist/NTOverAOA.exe
          if-no-files-found: error
